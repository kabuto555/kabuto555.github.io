<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call of Darkly: Miyazaki Warfare</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      #ui { position: fixed; inset: 0; pointer-events: none; font: 12px monospace; color: #ddd; }
      #fps { position: absolute; top: 4px; right: 6px; text-shadow: 1px 1px 0 #000; }
      /* Shown only on touch-only devices: the game needs keyboard + mouse. */
      #desktop-only { display: none; position: fixed; inset: 0; z-index: 10; background: #0a0a0c; color: #d8d0b8;
        font: 18px/1.4 'Courier New', monospace; text-align: center; padding: 24px; box-sizing: border-box;
        flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      #desktop-only h1 { font-size: 22px; margin: 0; color: #e0c050; }
      #desktop-only p { margin: 0; max-width: 32em; }
      #desktop-only a, #desktop-only button { font: inherit; color: #d8d0b8; background: #1c1b18; border: 2px solid #6a6350;
        padding: 8px 16px; text-decoration: none; cursor: pointer; }
      @media (hover: none) and (pointer: coarse) { #desktop-only { display: flex; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"><div id="fps">-- fps</div></div>
    <div id="desktop-only">
      <h1>Call of Darkly: Miyazaki Warfare</h1>
      <p>This game needs a keyboard and mouse. Please open it on a desktop or laptop.</p>
      <a href="/pages/game-design.html">Back to games</a>
      <button type="button" onclick="this.parentNode.remove()">Continue anyway</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
