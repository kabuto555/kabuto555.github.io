- name: "Call of Darkly: Miyazaki Warfare"
  screenshots:
    - "/assets/images/games/call_of_darkly_1.png"
    - "/assets/images/games/call_of_darkly_2.png"
    - "/assets/images/games/call_of_darkly_3.png"
    - "/assets/images/games/call_of_darkly_4.png"
  links: "[Play Game](/game-design/call_of_darkly/dist/index.html)"
  control: "Desktop only: keyboard + mouse"
  details: "An experimental PS1-style FPS mashup where a modern military operator gets dropped into a grim, Souls-like dark fantasy world. You get guns with aiming down sights, reloads and loot drops, but also bonfires, estus, stamina-based dodge rolls, and losing your souls when you die. Fight your way from the shrine through the undead-infested burg up to a giant demon boss. It uses a custom render pipeline to get that low-res, wobbly, dithered PS1 look."
  tech: "TypeScript, Three.js, WebGL (custom PS1 render pipeline), Web Audio API, Vite, AI-Assisted"
