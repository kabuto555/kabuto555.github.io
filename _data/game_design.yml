  details: "A goofy puzzle game where you play as a doge filling in for the missing owner of a ramen shop. Walk across the grid of broth pots, stepping on dry instant ramen noodles to sink them into the hot soup, and find an efficient route from the start tile to the finish. (Did I mention I love noodles?)"
