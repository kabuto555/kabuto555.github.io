  hackathon: "Zynga 2026 Hackathon"
  codesigner: "Co-Designer: [Joel Desjardin](https://joeldesjardins.com)"
  control: "Mobile control preferred"
  details: "A cozy 3D social mmo-slop summer camp sandbox game. The idea is that everyone does activities together in realtime, and you can join in, spectate, or just chill and socialize. Roam around Camp Chonkton with other campers, ride the cliffside zipline and hang glide off the summit. There are party minigames (Sumo, Dodgeball, River Log Race), co-op events (Lunch Delivery), and tabletop classics (Words With Friends, Dice with Friends). We also threw in a mock Camp Pass, Camp Care Package gacha, and a cabin dressing room with tent customization. (Because what's a summer camp without a battle pass? 🗿)"
  tech: "TypeScript, Three.js, Rapier Physics, WebGL, Web Audio API, AI-Assisted"
