  details: "A colorful 3D fruit-munching puzzle game in a hybrid casual style. Each stage is a tropical fruit made of emoji gaussian splats. Pick an emoji type to munch the matching emoji right in front of you, and eat your way through the fruit to find all 3 stars. I added mock monetization too, to get the full hybrid casual experience."
