- name: "Chipmunk 🐿<br>(2026)"
  image: chipmunk.jpg
  details: "A silly desktop app that wraps the Spotify Web Player and makes every song sound like it's sung by chipmunks. It speeds tracks up to 2x with pitch preservation turned off, and there's a little floating control pill with presets (Nightcore, Chipmunk, Helium, Octave). There's also a pixel-art chipmunk crew that dances to the music, throws seeds and nuts, and play some sports. (Driven by a beat detector that analyzes the audio as it plays.) 🐿"
  tech: Electron (castLabs Widevine), JavaScript, Web Audio API, Canvas
- name: "instant ramen 🍜<br>(2026)"
  image: instant_ramen.webp
  details: "Describe some music in plain words and get a multi-track song back that you can play, edit in a piano roll, and keep tweaking with more prompts, you can even save the MIDI data to . Under the hood, the AI plans out the song sections, writes reusable patterns and motifs, and picks from suitable virtual instruments (sampled, synths and drum machines) with effects and automation. There's also a Critique button where a deliberately harsh AI reviewer scores your song out of 10 and tells you what to fix. You can export to MIDI (and then import into your DAW), a mastered WAV/MP3 that's loudness-matched for streaming, or stems for a DAW, game engine, or video editor."
  tech: TypeScript, React, Vite, Web Audio API, Node.js, Express, Electron, Cloudflare Pages, Supabase, LLM APIs
