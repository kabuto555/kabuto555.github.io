- name: "Chipmunk 🐿<br>(2026)"
  id: chipmunk
  image: chipmunk.jpg
  details: "A silly desktop app that wraps the Spotify Web Player and makes every song sound like it's sung by chipmunks. It speeds tracks up to 2x with pitch preservation turned off, and there's a little floating control pill with presets (Nightcore, Chipmunk, Helium, Octave). There's also a pixel-art chipmunk crew that dances to the music, throws seeds and nuts, and plays some sports. (Driven by a beat detector that analyzes the audio as it plays.) 🐿"
  tech: Electron (castLabs Widevine), JavaScript, Web Audio API, Canvas
